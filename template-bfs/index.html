    <!-- Preguntas frecuentes en datos estructurados. Es el formato que los
         motores de IA citan textualmente al responder cosas como "que
         necesito para mi primera clase de karate". Solo van las respuestas
         confirmadas: las que siguen entre llaves no se publican. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "@id": "https://bfsmartialart.com/#preguntas",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "Necesito experiencia previa?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No. La mayoria de nuestros alumnos empezaron desde cero, incluidos varios que hoy compiten a nivel estatal. Cada clase tiene correccion individual, asi que no te vas a sentir perdido."
          }
        },
        {
          "@type": "Question",
          "name": "Que necesito para la primera clase?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Ropa deportiva comoda, agua y ganas. El karategi (gi) solo lo vas a necesitar cuando decidas inscribirte formalmente."
          }
        },
        {
          "@type": "Question",
          "name": "Hay limite de edad para empezar?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Recibimos desde los 4 anos en Karate Kids y no tenemos limite superior. Adultos de 40, 50 y 60+ entrenan en el programa de Karate Adultos a su propio ritmo."
          }
        },
        {
          "@type": "Question",
          "name": "Es obligatorio competir?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No. Solo el programa de Karate Competitivo esta orientado a torneos. En el resto puedes entrenar toda tu vida sin pisar una competencia."
          }
        },
        {
          "@type": "Question",
          "name": "Cada cuanto se sube de cinta?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Depende del avance individual, no del calendario. En promedio los examenes de grado se presentan cada 4 a 6 meses de entrenamiento constante."
          }
        },
        {
          "@type": "Question",
          "name": "Puedo cambiar de programa?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Si, en cualquier momento. Si empezaste en Adultos y te interesa el alto rendimiento, solo se ajusta la mensualidad al nuevo programa."
          }
        },
        {
          "@type": "Question",
          "name": "Que pasa si falto varias clases?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No se pierde la mensualidad ni el avance. Al volver, el instructor te reubica en el punto tecnico donde te quedaste."
          }
        }
      ]
    }
    </script>
